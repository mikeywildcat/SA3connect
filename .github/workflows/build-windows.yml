name: Build & Sign Windows

on:
  push:
    tags:
      - 'v*'          # Triggers on version tags e.g. v1.0.0, v1.1.0
  workflow_dispatch:  # Also allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Python ──────────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt6 pyinstaller

      # ── Build EXE ───────────────────────────────────────────────────────────
      - name: Build with PyInstaller
        run: pyinstaller NMEARelay-Windows.spec --clean --noconfirm

      - name: Verify EXE exists
        run: |
          if (!(Test-Path "dist\SA3NMEARelay.exe")) {
            Write-Error "EXE not found in dist\"
            exit 1
          }
          Write-Host "EXE size: $((Get-Item 'dist\SA3NMEARelay.exe').Length / 1MB) MB"

      # ── Authenticode Sign ────────────────────────────────────────────────────
      # Requires these GitHub repository secrets to be set:
      #   WINDOWS_CERTIFICATE   — Base64-encoded .pfx certificate file
      #   WINDOWS_CERT_PASSWORD — Password for the .pfx file
      #
      # To create: in PowerShell on Windows with your .pfx:
      #   [Convert]::ToBase64String([IO.File]::ReadAllBytes("cert.pfx")) | clip
      # Then paste as the WINDOWS_CERTIFICATE secret value.
      - name: Sign EXE (if certificate available)
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          # Decode certificate from base64 secret
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath  = "$env:TEMP\sa3relay.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          # Sign the EXE with signtool
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          if (!(Test-Path $signtool)) {
            # Find signtool wherever Windows SDK installed it
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter "signtool.exe" |
                         Where-Object { $_.FullName -match "x64" } |
                         Select-Object -First 1).FullName
          }

          & $signtool sign `
            /fd SHA256 `
            /td SHA256 `
            /tr http://timestamp.digicert.com `
            /f $certPath `
            /p $env:WINDOWS_CERT_PASSWORD `
            /d "SA3 NMEA Relay" `
            /du "https://github.com/mikeywildcat/SA3connect" `
            dist\SA3NMEARelay.exe

          # Clean up certificate file
          Remove-Item $certPath -Force

          Write-Host "Signing complete."

      # ── Package as ZIP ──────────────────────────────────────────────────────
      - name: Package EXE as ZIP
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "SA3NMEARelay-$tag-windows.zip"
          Compress-Archive -Path dist\SA3NMEARelay.exe -DestinationPath "dist\$zipName"
          Write-Host "Created: dist\$zipName"

      # ── Upload to GitHub Release ─────────────────────────────────────────────
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/SA3NMEARelay-*-windows.zip
          fail_on_unmatched_files: true
